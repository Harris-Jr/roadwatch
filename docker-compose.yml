services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: roadwatch
      POSTGRES_DB: roadwatch
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    # Requires zambia-latest.osrm* files in ./osrm-data — see the "Setting
    # up real routing" section in the README. Won't start successfully
    # until that one-time setup has been run.
    command: osrm-routed --algorithm mld /data/zambia-latest.osrm

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./backend/seed.py:/app/backend/seed.py
      - ./ai/ai:/app/ai/ai
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional convenience service — runs the Vite dev server in a container so
  # `docker compose up` brings up the whole application at once. For faster
  # hot-reload during active frontend work, running `npm run dev` directly on
  # your machine (see frontend/README or the main README) is usually nicer;
  # this container is here so the app also works with zero local Node setup.
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api

volumes:
  db_data:
